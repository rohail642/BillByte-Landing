<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Outfit','Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="50%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#f0faf4"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fef9f0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fef9f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1a1208" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Decorative soft blobs -->
  <circle cx="120" cy="120" r="180" fill="#16a34a" opacity="0.06"/>
  <circle cx="1090" cy="540" r="220" fill="#16a34a" opacity="0.07"/>

  <!-- Badge -->
  <g filter="url(#soft)">
    <rect x="100" y="118" width="372" height="48" rx="24" fill="#ffffff" stroke="#ece4d6" stroke-width="1.5"/>
  </g>
  <circle cx="128" cy="142" r="5" fill="#16a34a"/>
  <text x="148" y="148" font-size="17" font-weight="600" fill="#5a5040" letter-spacing="0.3">Built for Indian restaurants</text>

  <!-- Headline -->
  <text x="98" y="300" font-size="116" font-weight="900" fill="#1a1208" letter-spacing="-5">The smartest POS</text>
  <text x="98" y="412" font-size="116" font-weight="900" fill="#16a34a" letter-spacing="-5">for India.</text>

  <!-- Subtext -->
  <text x="100" y="478" font-size="27" font-weight="400" fill="#5a5040">Billing · KOT · Tables · Inventory · CRM · Online orders — all in one.</text>

  <!-- Footer / brand -->
  <text x="100" y="560" font-size="24" font-weight="800" fill="#1a1208" letter-spacing="-0.5">BillByte</text>
  <text x="246" y="560" font-size="22" font-weight="500" fill="#9b8f7d">www.billbyte.co.in</text>

  <!-- Right-side mark -->
  <g filter="url(#soft)">
    <rect x="980" y="150" width="120" height="120" rx="28" fill="#16a34a"/>
  </g>
  <text x="1040" y="232" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
</svg>
